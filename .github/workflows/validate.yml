name: Validate
run-name: Validate ${{ github.sha }}

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  flutter:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Flutter analyze and test
            sdk: '3.38.4'
          - name: Release SDK tests
            version_file: .fvmrc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.sdk }}
          flutter-version-file: ${{ matrix.version_file }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: matrix.sdk == '3.38.4'
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --concurrency=2
